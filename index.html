<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tic-tac-toe — anti-diagonal bug demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
  #board { display: grid; grid-template-columns: repeat(3, 96px); gap: 6px; margin: 1rem 0; }
  .cell { width: 96px; height: 96px; font-size: 2.4rem; font-weight: 700; border: 2px solid #222; background: #fff; cursor: pointer; }
  .cell:disabled { cursor: default; opacity: 0.95; }
  .cell.win { background: #ffe08a; }
  #status { font-weight: 600; min-height: 1.4rem; }
  button.action { margin-right: 0.5rem; }
  code { background: #f2f2f2; padding: 0.1rem 0.3rem; border-radius: 3px; }
</style>
<h1>tic-tac-toe</h1>
<p>Play the game. Use <button class="action" id="prefill">Pre-fill anti-diagonal</button>
 <button class="action" id="reset">Reset</button></p>
<div id="board"></div>
<div id="status"></div>
<script>
(function () {
  // Inlined from tictactoe.js (keep in sync, zero deps)
  const WIN_LINES = [
    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],
    [0, 3, 6],
    [1, 4, 7],
    [2, 5, 8],
    [0, 4, 8],
    // PLANTED BUG: [2, 4, 6] missing — anti-diagonal win returns null
  ];
  function checkWinner(board) {
    for (const [a, b, c] of WIN_LINES) {
      if (board[a] != null && board[a] === board[b] && board[a] === board[c]) return board[a];
    }
    return null;
  }
  function isDraw(board) {
    return checkWinner(board) == null && board.every(v => v != null);
  }

  let board = Array(9).fill(null);
  let player = 'X';
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');

  function render() {
    boardEl.innerHTML = '';
    const winLine = (() => {
      for (const line of WIN_LINES) {
        const [a,b,c] = line;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) return line;
      }
      return null;
    })();
    const winner = checkWinner(board);
    const draw = isDraw(board);
    for (let i = 0; i < 9; i++) {
      const btn = document.createElement('button');
      btn.className = 'cell' + (winLine && winLine.includes(i) ? ' win' : '');
      btn.textContent = board[i] || '';
      btn.disabled = board[i] != null || !!winner || draw;
      btn.addEventListener('click', () => {
        if (board[i] != null || winner || draw) return;
        board[i] = player;
        player = player === 'X' ? 'O' : 'X';
        render();
      });
      boardEl.appendChild(btn);
    }
    if (winner) statusEl.textContent = `Winner: ${winner}  (line ${winLine.join('-')})`;
    else if (draw) statusEl.textContent = 'Draw';
    else statusEl.textContent = `Next: ${player}`;
  }

  document.getElementById('reset').addEventListener('click', () => {
    board = Array(9).fill(null);
    player = 'X';
    render();
  });

  document.getElementById('prefill').addEventListener('click', () => {
    // tictactoe.test.js anti-diagonal case: ['X','X','O','X','O',null,'O',null,null] → O should win
    board = ['X','X','O','X','O',null,'O',null,null];
    player = 'X';
    render();
    const w = checkWinner(board);
    if (w == null) {
      statusEl.textContent += ' — expected O on 2-4-6, got null (bug). Open an issue to trigger the fix.';
    }
  });

  render();
})();
</script>
